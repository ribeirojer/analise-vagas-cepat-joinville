name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências Python
        run: python -m pip install -r pipeline/requirements.txt
      - name: Testes unitários
        run: python -m unittest discover -s pipeline/tests -p "test_units.py" -v
      - name: Teste de integração (jan/2026)
        run: python -m unittest discover -s pipeline/tests -p "test_integration.py" -v
